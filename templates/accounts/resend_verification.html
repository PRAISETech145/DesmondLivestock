{% extends "base.html" %}
{% load static %}
{% block title %}Resend Verification - Livestock Market{% endblock %}

{% block header_bg %}
<img src="{% static 'imgs/what-is-intensive-livestock-farming.jpg' %}" alt="" class="w-full h-full object-cover opacity-40">
{% endblock %}

{% block hero %}
<div class="relative z-10 flex min-h-[calc(100vh-header-height)] items-center justify-center px-3 py-8 sm:px-4 sm:py-12" style="--header-height: 4rem;">
  <div class="max-w-md w-full">
    <div class="bg-white border border-gray-200 rounded-2xl p-5 sm:p-6 lg:p-8 shadow-xl">
      <h2 class="text-xl sm:text-2xl font-bold text-gray-900 text-center mb-5 sm:mb-6">Resend Verification Email</h2>

      <form method="post" class="space-y-4 sm:space-y-5" id="resend-form">
        {% csrf_token %}

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
            Email Address
          </label>
          <input type="email" name="email" id="email" required
                 class="w-full px-4 py-3 border border-gray-300 rounded-xl text-gray-900 focus:ring-2 focus:ring-gray-500 focus:border-gray-500 transition-all"
                 placeholder="you@example.com">
        </div>

        <button type="submit"
                class="w-full bg-gray-900 text-white py-3.5 rounded-xl font-semibold text-base sm:text-lg hover:bg-gray-700 transition-colors touch-manipulation">
          Send Verification Email
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm sm:text-base mt-5">
        <a href="{% url 'accounts:login' %}" class="text-gray-900 font-medium hover:text-gray-700">Back to Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block content %}{% endblock %}
