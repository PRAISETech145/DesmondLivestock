{% load static %}
<button hx-post="{% url 'agroforum:post_like' post.pk %}"
        hx-target="closest .post-like-container"
        hx-swap="outerHTML"
        class="post-like-container flex items-center gap-1.5 text-gray-500 hover:text-green-600 transition-colors py-1"
        aria-label="{% if liked %}Unlike{% else %}Like{% endif %} this post">
  {% if liked %}
  <svg class="w-5 h-5 text-green-600" fill="currentColor" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"></path></svg>
  {% else %}
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"></path></svg>
  {% endif %}
  <span class="text-sm font-medium">{{ post.like_count }}</span>
</button>
