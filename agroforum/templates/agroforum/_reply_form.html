{% load static %}
<div class="reply-form mt-3 ml-8 md:ml-12 border-l-2 border-gray-100 pl-4"
     id="reply-form-{{ parent_comment.pk }}">
  <form hx-post="{{ post.get_absolute_url }}"
        hx-target="#comments-list"
        hx-swap="afterbegin"
        hx-on::after-request="this.closest('.reply-form').remove()"
        class="space-y-2">
    {% csrf_token %}
    <input type="hidden" name="parent_id" value="{{ parent_comment.pk }}">

    <div class="flex gap-3">
      {% if user.avatar %}
      <img src="{{ user.avatar_url }}" alt="{{ user.username }}" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
      {% else %}
      <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0">
        {{ user.initials }}
      </div>
      {% endif %}
      <div class="flex-1">
        {{ form.content }}
        <div class="flex justify-end gap-2 mt-1">
          <button type="button"
                  hx-get=""
                  hx-target="#reply-form-{{ parent_comment.pk }}"
                  hx-swap="innerHTML"
                  class="text-sm text-gray-500 hover:text-gray-700">Cancel</button>
          <button type="submit"
                  class="bg-green-600 text-white px-3 py-1.5 rounded-lg font-medium text-sm hover:bg-green-700 transition-colors">
            Reply
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
